name: Update Scoop manifests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest

    steps:
      - name: Checkout bucket
        uses: actions/checkout@v6

      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm get.scoop.sh | iex

      - name: Update manifests
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop update
          & "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1" qontrolpanel -u

      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/qontrolpanel.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No manifest changes."
            exit 0
          }
          git commit -m "Update QontrolPanel manifest"
          git push
