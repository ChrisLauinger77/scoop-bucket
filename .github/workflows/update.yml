name: Update Scoop manifests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest

    steps:
      - name: Checkout bucket
        uses: actions/checkout@v7

      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm get.scoop.sh | iex

      - name: Update manifests
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop update
          $manifests = @("qontrolpanel", "toerings")
          foreach ($manifest in $manifests) {
            & "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1" $manifest bucket -Update
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/qontrolpanel.json bucket/toerings.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No manifest changes."
            exit 0
          }
          git commit -m "Update Scoop manifests"
          git push
